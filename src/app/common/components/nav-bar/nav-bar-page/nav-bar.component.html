<header class="navbar-container fixed top-0 w-full z-50 shadow-md" [ngClass]="{ scrolled: navbarState.isScrolled }" role="banner">
  @if (navbarState.isMobileView) {
    <nav class="mobile-navbar grid grid-cols-[auto_1fr_auto] justify-around p-3" role="navigation" aria-label="Mobile navigation">
      <button
        type="button"
        class="burger-button p-2 rounded-full"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="navbarState.isMobileMenuOpen ? 'Close main menu' : 'Open main menu'"
        [attr.aria-expanded]="navbarState.isMobileMenuOpen">
        <i class="pi" [ngClass]="navbarState.isMobileMenuOpen ? 'pi-times' : 'pi-bars'" aria-hidden="true"></i>
      </button>

      <div class="flex justify-center">
        <app-navbar-logo [logoSrc]="logo" [isMobile]="true" />
      </div>

      <div class="flex justify-between items-center space-x-3">
        <app-switch-dark-mode />
      </div>
    </nav>

    @if (navbarState.isMobileMenuOpen) {
      <app-mobile-menu [menuItems]="menuItems" (itemClick)="closeMobileMenu()" />
    }
  } @else {
    <nav class="desktop-navbar grid grid-cols-[auto_1fr_auto] items-center p-3" role="navigation" aria-label="Main navigation">
      <app-navbar-logo [logoSrc]="logo" [isMobile]="false" />

      <div class="flex justify-center">
        @if (isAuthenticated()) {
          <app-desktop-menu [menuItems]="menuItems" />
        }
      </div>

      <div class="flex justify-between items-center space-x-3">
        <app-switch-dark-mode />

        @if (isAuthenticated()) {
          <app-user-info [userInfo]="getCurrentUserInfo()" />
        } @else {
          <div class="flex space-x-3">
            <app-desktop-menu [menuItems]="menuItems" />
          </div>
        }
      </div>
    </nav>
  }
</header>
