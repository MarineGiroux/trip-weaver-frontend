<section
  class="user-info px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 flex items-center gap-2 shadow-sm"
  role="banner"
  aria-label="User information">
  <i class="pi pi-user text-gray-600 dark:text-gray-300" aria-hidden="true"></i>
  <div class="flex flex-col text-xs">
    <span class="text-gray-700 dark:text-gray-200 font-medium">{{ userInfo.displayName }}</span>
    <span class="text-gray-600 dark:text-gray-400 text-[0.7rem]">{{ userInfo.role }}</span>
  </div>
</section>
