name: CI - Continuous Integration E2E Tests

on:
  pull_request:
    branches:
      - staging

jobs:
  e2e-frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🔧 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🚀 Démarrer le serveur avec configuration staging
        run: |
          npm run serve --env=staging &
          
          # Attendre que le serveur soit prêt
          echo "⏳ Attente du démarrage du serveur..."
          timeout 300 bash -c 'until curl -f http://localhost:4200 > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Serveur prêt"

      - name: 🎯 Lancer les tests E2E frontend avec Cypress
        run: npm run cypress:run

  ci-success-e2e:
    runs-on: ubuntu-latest
    needs: [ e2e-frontend-tests ]
    if: always()
    steps:
      - name: ✅ Vérifier le statut du CI
        run: |
          echo "🔍 Statuts des jobs :"
          echo "- Tests E2E frontend : ${{ needs.e2e-frontend-tests.result }}"
          echo "- Type d'événement : ${{ github.event_name }}"
          echo "- Branche cible : ${{ github.base_ref }}"
          echo "- Branche source : ${{ github.head_ref }}"

          if [[ "${{ needs.e2e-frontend-tests.result }}" != "success" ]]; then
            echo "❌ CI échoué : Tests E2E ont échoué"
            echo "  - Tests E2E frontend : ${{ needs.e2e-frontend-tests.result }}"
            exit 1
          fi

          echo ""
          echo "🎉 CI réussi ! Toutes les étapes requises sont passées avec succès."
          echo "✅ Tests E2E frontend : OK"
          echo ""
          echo "🚀 Le code est prêt pour la suite du processus !"