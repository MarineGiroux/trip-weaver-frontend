name: CI - Continuous Integration

on:
  pull_request:
    branches:
      - development
      - staging
      - production

jobs:
  unit-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🔧 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 📝 Vérifier la syntaxe (Lint)
        run: npm run lint

      - name: 🧪 Lancer les tests unitaires et d'intégration
        run: npm run test

      - name: 📊 Tests avec couverture
        run: npm run test:coverage

  ci-success:
    runs-on: ubuntu-latest
    needs: [unit-integration-tests]
    if: always()
    steps:
      - name: ✅ Vérifier le statut du CI
        run: |
          echo "🔍 Statuts des jobs :"
          echo "- Tests unitaires/intégration : ${{ needs.unit-integration-tests.result }}"
          echo "- Type d'événement : ${{ github.event_name }}"
          echo "- Branche cible : ${{ github.base_ref }}"
          echo "- Branche source : ${{ github.head_ref }}"
          
          if [[ "${{ needs.unit-integration-tests.result }}" != "success" ]]; then
            echo "❌ CI échoué : Tests unitaires/intégration ont échoué"
            exit 1
          fi
          echo ""
          echo "🎉 CI réussi ! Toutes les étapes requises sont passées avec succès."
          echo "✅ Tests unitaires/intégration : OK"
          echo "✅ Construction des images Docker : OK"
          
          echo ""
          echo "🚀 Le code est prêt pour la suite du processus !"